<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">CUSTODIA — Mantén viva la base. Vuelve a casa.</title>
<desc id="desc">Una estación orbital sobre un planeta azul. Diez días hasta el rescate, cuatro sistemas que cuidar.</desc>
