<rect x="56" y="41" width="8" height="8" rx="2" fill="#70ead3"/>
<text x="76" y="50" fill="#a8c6d4" font-size="12" letter-spacing="3">LOS TIRAVIDA / MISSION LOG</text>
<text x="52" y="151" fill="#f0f7f7" font-size="82" font-weight="800" letter-spacing="4">CUSTODIA</text>
<text x="57" y="198" fill="#78e6d3" font-size="25" font-weight="600">Mantén viva la base. Vuelve a casa.</text>
<text x="57" y="238" fill="#a8c1cf" font-size="16">El rescate llega en 10 días. Cada decisión cuenta.</text>
